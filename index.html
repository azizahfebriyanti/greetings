<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>to: kak satrio</title>
  <meta name="description" content="for you">
  <meta property="og:title" content="a little letter for you 💌">
  <meta name="theme-color" content="#08090d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --night: #08090d;
      --ink: #f5eee8;
      --muted: #c5b9b4;
      --red: #e33a43;
      --wine: #741923;
      --warm: #f3c9a4;
      --serif: "Baskerville", "Palatino Linotype", "Book Antiqua", Georgia, "Times New Roman", serif;
      --sans: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-width: 320px; min-height: 100%; background: var(--night); }

    body {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 112%, rgba(62, 12, 21, .46), transparent 53%),
        radial-gradient(ellipse at 13% 16%, rgba(90, 15, 24, .18), transparent 34%),
        radial-gradient(ellipse at 88% 31%, rgba(16, 39, 72, .22), transparent 38%),
        linear-gradient(155deg, #0d0e14 0%, #08090d 57%, #0b090c 100%);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .scene, .scene__glow, .scene__fog, .scene__spores,
    .scanlines, .grain, .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .scene { z-index: -1; overflow: hidden; }

    .scene__glow {
      inset: -12%;
      background:
        radial-gradient(ellipse at var(--pointer-x, 18%) var(--pointer-y, 26%), rgba(169, 30, 41, .2), transparent 34%),
        radial-gradient(ellipse at 80% 78%, rgba(111, 19, 33, .16), transparent 30%),
        radial-gradient(ellipse at 71% 12%, rgba(43, 71, 116, .13), transparent 35%);
      opacity: .82;
      transform: translate3d(0, 0, 0);
      animation: glow-breathe 14s ease-in-out infinite alternate;
    }

    .scene__fog {
      inset: auto -18% -19%;
      height: min(66vh, 570px);
      background:
        radial-gradient(ellipse at 20% 55%, rgba(128, 27, 39, .19), transparent 51%),
        radial-gradient(ellipse at 73% 39%, rgba(40, 55, 79, .19), transparent 49%),
        radial-gradient(ellipse at 50% 70%, rgba(105, 38, 37, .13), transparent 55%);
      filter: blur(36px);
      opacity: .78;
      animation: fog-drift 28s ease-in-out infinite alternate;
    }

    .scene__spores { overflow: hidden; }

    .spore {
      position: absolute;
      top: var(--top);
      left: var(--left);
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--spore-color, rgba(232, 184, 145, .72));
      box-shadow: 0 0 9px 2px var(--spore-glow, rgba(224, 81, 65, .22));
      opacity: 0;
      animation: spore-float var(--duration) var(--delay) ease-in-out infinite;
      will-change: transform, opacity;
    }

    .scanlines {
      z-index: 3;
      opacity: .14;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .34) 4px);
    }

    .grain {
      z-index: 4;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }

    .vignette {
      z-index: 2;
      background: radial-gradient(ellipse at center, transparent 28%, rgba(0, 0, 0, .24) 70%, rgba(0, 0, 0, .58) 130%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 570px);
      padding: clamp(34px, 7vw, 58px) clamp(24px, 7vw, 58px) 32px;
      overflow: hidden;
      border: 1px solid rgba(233, 192, 174, .2);
      border-radius: 4px;
      background:
        radial-gradient(ellipse at 50% 0, rgba(111, 25, 35, .18), transparent 54%),
        linear-gradient(155deg, rgba(20, 20, 27, .97), rgba(12, 12, 17, .965) 61%, rgba(17, 13, 16, .97));
      box-shadow: 0 34px 100px rgba(0, 0, 0, .52), 0 0 80px rgba(95, 17, 29, .12), inset 0 1px rgba(255, 255, 255, .035);
      text-align: center;
      animation: card-arrive .8s cubic-bezier(.2, .75, .25, 1) both;
    }

    .card::before, .card::after {
      position: absolute;
      z-index: 0;
      content: "";
      pointer-events: none;
    }

    .card::before {
      inset: 10px;
      border: 1px solid rgba(233, 192, 174, .075);
    }

    .card::after {
      top: -100px;
      left: -45%;
      width: 50%;
      height: 140%;
      background: linear-gradient(100deg, transparent, rgba(235, 202, 178, .045), transparent);
      transform: rotate(12deg);
      animation: card-sheen 1.4s .65s ease-out both;
    }

    .card > * { position: relative; z-index: 1; }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 0 auto 25px;
      color: var(--warm);
      opacity: .82;
      animation: support-arrive .65s .15s both;
    }

    .ornament::before, .ornament::after {
      width: 54px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(230, 173, 145, .68));
    }

    .ornament::after { transform: rotate(180deg); }

    .ornament__star { font-size: .73rem; text-shadow: 0 0 12px rgba(231, 70, 74, .75); }

    h1 {
      position: relative;
      margin: 0;
      color: #f5eae2;
      font-family: var(--serif);
      font-size: clamp(2.35rem, 8.5vw, 3.65rem);
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1.08;
      text-wrap: balance;
      text-shadow: 0 0 24px rgba(167, 30, 42, .28), 0 2px 1px rgba(0, 0, 0, .75);
      animation: title-reveal .95s .18s cubic-bezier(.18, .75, .25, 1) both;
    }

    .sub {
      margin: 20px 0 31px;
      color: var(--muted);
      font-size: clamp(.98rem, 3vw, 1.075rem);
      line-height: 1.65;
      letter-spacing: .015em;
      animation: support-arrive .7s .44s both;
    }

    .btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      padding: 15px 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 227, 214, .3);
      border-radius: 3px;
      color: #fff8f2;
      background: linear-gradient(112deg, #761d29, #a32331 54%, #721b28);
      box-shadow: 0 10px 28px rgba(107, 18, 31, .28), inset 0 1px rgba(255, 255, 255, .14);
      font: 650 1rem/1.25 var(--sans);
      letter-spacing: .015em;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transform: translate3d(var(--mag-x, 0px), var(--mag-y, 0px), 0);
      transition: transform .22s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease;
      animation: support-arrive .7s .59s both;
    }

    .btn::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      content: "";
      background: linear-gradient(110deg, transparent 15%, rgba(255, 242, 228, .13) 50%, transparent 78%);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity .25s ease, transform .65s ease;
    }

    .btn:hover {
      border-color: rgba(255, 227, 214, .55);
      box-shadow: 0 12px 36px rgba(185, 35, 49, .28), 0 0 25px rgba(202, 44, 55, .17), inset 0 1px rgba(255, 255, 255, .18);
    }

    .btn:hover::before { opacity: 1; transform: translateX(35%); }

    .btn:active {
      transform: translate3d(var(--mag-x, 0px), var(--mag-y, 0px), 0) scale(.985);
      box-shadow: 0 4px 14px rgba(107, 18, 31, .34), inset 0 2px 8px rgba(0, 0, 0, .2);
    }

    .btn:focus-visible {
      outline: 2px solid #f0c79e;
      outline-offset: 5px;
    }

    .ripple {
      position: absolute;
      z-index: 0;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255, 242, 228, .55);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple-out .65s ease-out forwards;
    }

    .btn__label { position: relative; z-index: 1; }

    .msg {
      min-height: 4.25em;
      display: grid;
      place-items: center;
      margin: 26px 0 3px;
      color: #f1e6de;
      font-family: var(--serif);
      font-size: clamp(1.08rem, 3.7vw, 1.32rem);
      font-weight: 400;
      line-height: 1.55;
      white-space: pre-line;
      text-wrap: pretty;
      text-shadow: 0 0 18px rgba(181, 55, 53, .14);
      opacity: 0;
      filter: blur(4px);
      transform: translateY(8px);
      transition: opacity .6s ease, filter .65s ease, transform .65s cubic-bezier(.2, .75, .25, 1);
    }

    .msg.is-visible { opacity: 1; filter: blur(0); transform: translateY(0); }

    .count {
      min-height: 1.25em;
      margin: 4px 0 0;
      color: rgba(207, 185, 175, .72);
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .14em;
    }

    .foot {
      margin: 27px 0 0;
      color: #b9aaa5;
      font-size: .8rem;
      line-height: 1.5;
      letter-spacing: .015em;
      animation: support-arrive .7s .74s both;
    }

    .burst-particle {
      position: fixed;
      z-index: 6;
      top: var(--origin-y);
      left: var(--origin-x);
      pointer-events: none;
      user-select: none;
      font-size: var(--size);
      line-height: 1;
      text-shadow: 0 0 13px rgba(248, 101, 93, .64);
      animation: burst-drift var(--duration) var(--delay) cubic-bezier(.12, .64, .24, 1) forwards;
      will-change: transform, opacity;
    }

    @keyframes card-arrive {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px) scale(.985); }
      to { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    }

    @keyframes title-reveal {
      from { opacity: 0; clip-path: inset(0 100% 0 0); filter: blur(5px); transform: translateY(8px); }
      to { opacity: 1; clip-path: inset(-5% -1% -5% 0); filter: blur(0); transform: translateY(0); }
    }

    @keyframes support-arrive {
      from { opacity: 0; filter: blur(3px); transform: translateY(9px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }

    @keyframes card-sheen {
      0% { opacity: 0; transform: translateX(-20%) rotate(12deg); }
      20% { opacity: 1; }
      100% { opacity: 0; transform: translateX(460%) rotate(12deg); }
    }

    @keyframes glow-breathe {
      from { opacity: .62; transform: scale(1); }
      to { opacity: .95; transform: scale(1.025); }
    }

    @keyframes fog-drift {
      from { transform: translate3d(-2%, 0, 0) scale(1); }
      to { transform: translate3d(3%, -5%, 0) scale(1.08); }
    }

    @keyframes spore-float {
      0% { opacity: 0; transform: translate3d(0, 12px, 0) scale(.7); }
      18% { opacity: var(--peak-opacity, .58); }
      72% { opacity: var(--peak-opacity, .58); }
      100% { opacity: 0; transform: translate3d(var(--drift-x), -58px, 0) scale(1.12); }
    }

    @keyframes ripple-out {
      to { opacity: 0; transform: translate(-50%, -50%) scale(14); }
    }

    @keyframes burst-drift {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(0deg); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(var(--scale)) rotate(var(--rotation)); }
    }

    @media (max-width: 400px) {
      body { padding-right: max(14px, env(safe-area-inset-right)); padding-left: max(14px, env(safe-area-inset-left)); }
      .card { padding-right: 22px; padding-left: 22px; }
      h1 { font-size: clamp(2.15rem, 10vw, 2.6rem); }
      .sub { margin-top: 16px; margin-bottom: 25px; }
      .foot { font-size: .76rem; }
    }

    @media (max-height: 650px) and (min-width: 600px) {
      body { padding-top: 18px; padding-bottom: 18px; }
      .card { padding-top: 30px; padding-bottom: 24px; }
      .ornament { margin-bottom: 16px; }
      .sub { margin-top: 13px; margin-bottom: 21px; }
      .msg { margin-top: 19px; }
      .foot { margin-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .scene__glow, .scene__fog, .scene__spores { display: none; }
      .msg { filter: none; transform: none; }
      .burst-particle, .ripple { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene__glow" id="ambientGlow"></div>
    <div class="scene__fog"></div>
    <div class="scene__spores" id="spores"></div>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="card">
    <div class="ornament" aria-hidden="true"><span class="ornament__star">✦</span></div>
    <h1>HAPPY THURSDAY!</h1>
    <p class="sub" id="sub">to one of my favorite person 💖</p>
    <button class="btn" id="love" type="button"><span class="btn__label">open today's letter 💌</span></button>
    <p class="msg" id="msg" aria-live="polite" aria-atomic="true"></p>
    <p class="count" id="count" aria-hidden="true"></p>
    <p class="foot">made with love ⸜(｡˃ ᵕ ˂ )⸝♡</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const NAMA = ""; // isi nama
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    if (NAMA) $("sub").textContent = "to " + NAMA + "! " + $("sub").textContent;

    // ucapan + hati meletup
    const M = [
      "i rarely say it but i'm proud of you for always doing your best to grow and become a better person each day 💖",
      "hope you have a wonderful day kak! ✨",
      "semangat kerjanya sampe bisa renov rumah duta~ 🏠",
      "LET'S GO SOON-TO-BE SENIOR ASSO!!!",
      "don't forget to drink a bottle of wotah (in british acccent) \nkarena habis ini kita buat tenggorokan itu overwork 🎤",
      "Your red and my blue. \nNow I see the world in \npurple💜\n\n-Olivia Rodrigo-",
      "'So, surely with hardship comes ease. Indeed, with hardship comes ease.' \n\n-Surah Ash‑Sharh (94:5–6)-",
      "وَمَا هَـٰذِهِ ٱلْحَيَوٰةُ ٱلدُّنْيَآ إِلَّا لَهْوٌ وَلَعِبٌ ۚ وَإِنَّ ٱلدَّارَ ٱلْـَٔاخِرَةَ لَهِىَ ٱلْحَيَوَانُ ۚ لَوْ كَانُواْ يَعْلَمُونَ ٦٤ \n'This worldly life is no more than play and amusement. But the Hereafter is indeed the real life, if only they knew.' \n\n-Surah Al-'Ankabut [29:64]-",

    ];
    let last = -1;

    function makeSpores() {
      const host = $("spores");
      const amount = window.innerWidth < 600 ? 16 : 28;
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < amount; i++) {
        const spore = document.createElement("span");
        spore.className = "spore";
        spore.style.setProperty("--top", (8 + Math.random() * 88) + "%");
        spore.style.setProperty("--left", (3 + Math.random() * 94) + "%");
        spore.style.setProperty("--size", (1.5 + Math.random() * 2.3) + "px");
        spore.style.setProperty("--duration", (14 + Math.random() * 16) + "s");
        spore.style.setProperty("--delay", (-Math.random() * 24) + "s");
        spore.style.setProperty("--drift-x", (-24 + Math.random() * 48) + "px");
        spore.style.setProperty("--peak-opacity", (.22 + Math.random() * .42).toFixed(2));
        if (Math.random() > .55) {
          spore.style.setProperty("--spore-color", "rgba(211, 92, 70, .72)");
          spore.style.setProperty("--spore-glow", "rgba(224, 67, 54, .25)");
        }
        fragment.appendChild(spore);
      }

      host.replaceChildren(fragment);
    }

    function burst(x, y) {
      if (reducedMotion.matches) return;

      const symbols = ["💖", "✨", "🌷", "💫", "🌸", "✦"];
      const fragment = document.createDocumentFragment();
      const active = document.querySelectorAll(".burst-particle");
      const maxActive = 48;
      for (let i = 0; i < Math.max(0, active.length - maxActive + 16); i++) active[i].remove();

      for (let k = 0; k < 16; k++) {
        const particle = document.createElement("span");
        const angle = Math.random() * Math.PI * 2;
        const distance = 62 + Math.random() * 90;
        particle.className = "burst-particle";
        particle.textContent = symbols[k % symbols.length];
        particle.style.setProperty("--origin-x", x + "px");
        particle.style.setProperty("--origin-y", y + "px");
        particle.style.setProperty("--dx", (Math.cos(angle) * distance) + "px");
        particle.style.setProperty("--dy", (Math.sin(angle) * distance - 22) + "px");
        particle.style.setProperty("--size", (15 + Math.random() * 12) + "px");
        particle.style.setProperty("--scale", (.7 + Math.random() * .8).toFixed(2));
        particle.style.setProperty("--rotation", (-65 + Math.random() * 130) + "deg");
        particle.style.setProperty("--duration", (850 + Math.random() * 450) + "ms");
        particle.style.setProperty("--delay", (Math.random() * 90) + "ms");
        particle.addEventListener("animationend", () => particle.remove(), { once: true });
        fragment.appendChild(particle);
      }

      document.body.appendChild(fragment);
    }

    function ripple(button, event) {
      if (reducedMotion.matches) return;
      const previous = button.querySelector(".ripple");
      if (previous) previous.remove();
      const bounds = button.getBoundingClientRect();
      const circle = document.createElement("span");
      circle.className = "ripple";
      circle.setAttribute("aria-hidden", "true");
      circle.style.left = (event.clientX ? event.clientX - bounds.left : bounds.width / 2) + "px";
      circle.style.top = (event.clientY ? event.clientY - bounds.top : bounds.height / 2) + "px";
      circle.addEventListener("animationend", () => circle.remove(), { once: true });
      button.appendChild(circle);
    }

    $("love").addEventListener("click", (event) => {
      last = (last + 1) % M.length;
      const next = last;

      const message = $("msg");
      message.classList.remove("is-visible");
      message.textContent = M[next];
      void message.offsetWidth;
      message.classList.add("is-visible");
      $("count").textContent = String(next + 1).padStart(2, "0") + " / " + String(M.length).padStart(2, "0");

      const bounds = event.currentTarget.getBoundingClientRect();
      const x = bounds.left + bounds.width / 2;
      const y = bounds.top + bounds.height / 2;
      ripple(event.currentTarget, event);
      burst(x, y);
    });

    const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
    if (finePointer.matches && !reducedMotion.matches) {
      let pointerQueued = false;
      document.addEventListener("pointermove", (event) => {
        if (pointerQueued) return;
        pointerQueued = true;
        window.requestAnimationFrame(() => {
          const x = (event.clientX / window.innerWidth) * 100;
          const y = (event.clientY / window.innerHeight) * 100;
          $("ambientGlow").style.setProperty("--pointer-x", x.toFixed(1) + "%");
          $("ambientGlow").style.setProperty("--pointer-y", y.toFixed(1) + "%");
          pointerQueued = false;
        });
      }, { passive: true });

      const button = $("love");
      button.addEventListener("pointermove", (event) => {
        const bounds = button.getBoundingClientRect();
        const x = (event.clientX - bounds.left - bounds.width / 2) * .045;
        const y = (event.clientY - bounds.top - bounds.height / 2) * .08;
        button.style.setProperty("--mag-x", Math.max(-5, Math.min(5, x)) + "px");
        button.style.setProperty("--mag-y", Math.max(-4, Math.min(4, y)) + "px");
      });
      button.addEventListener("pointerleave", () => {
        button.style.setProperty("--mag-x", "0px");
        button.style.setProperty("--mag-y", "0px");
      });
    }

    if (!reducedMotion.matches) makeSpores();
    window.addEventListener("resize", () => {
      if (!reducedMotion.matches) makeSpores();
    }, { passive: true });
  </script>
</body>
</html>
