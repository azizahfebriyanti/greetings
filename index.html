<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0a14">
<title>an owl post for you 🦉</title>
<script>
  (() => {
    const pages = ['letter', 'song', 'hadith', 'reason', 'place'];
    const pathPage = location.pathname.replace(/\/+$/, '').split('/').pop();
    const isSectionPage = location.hash.length > 1 || pages.includes(pathPage);
    if (!isSectionPage) document.documentElement.classList.add('mail-intro-enabled');
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦉%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{color-scheme:dark;--night:#0b0a14;--red:#740001;--gold:#d3a625;--gold2:#eeba30;--parch:#f1e3c3;--parch2:#dcc594;--ink:#3a2a1a;--green:#2c5a3b;--disp:"Cinzel Decorative",Georgia,serif;--cap:Cinzel,Georgia,serif;--body:"IM Fell English","Palatino Linotype",Georgia,serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100svh;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));font-family:var(--body);color:var(--parch);background:radial-gradient(ellipse at 50% -10%,#232a63,transparent 62%),radial-gradient(ellipse at 50% 115%,#4a0b16,transparent 55%),var(--night);overflow-x:hidden}
#sky,#candles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw var(--d) var(--l) infinite}
@keyframes tw{50%{opacity:.05}}
.candle{position:absolute;left:var(--x);top:var(--y);width:9px;height:32px;border-radius:2px;background:linear-gradient(90deg,#d8cbae,#fff6dc,#cbbd9c);animation:bob var(--d) ease-in-out infinite alternate}
.candle::before{content:"";position:absolute;left:50%;top:-15px;width:9px;height:16px;margin-left:-4.5px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(#fff 15%,var(--gold2) 45%,#e8731a);box-shadow:0 0 18px 8px #eeba3055;animation:fl .2s infinite alternate}
@keyframes bob{to{transform:translateY(-14px)}}
@keyframes fl{to{transform:scale(.88,1.1)}}
main{position:relative;z-index:1;max-width:700px;margin:0 auto;text-align:center}
.orn{margin:18px 0 8px;color:var(--gold);letter-spacing:.6em;opacity:.8}
h1{margin:0;font:700 clamp(2.1rem,9vw,3.6rem)/1.1 var(--disp);background:linear-gradient(#fff3c4,var(--gold2) 45%,#a8761a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px #740001aa)}
.sub{margin:14px 0 0;font-size:1.1rem;line-height:1.6;opacity:.88}
.seal{display:block;margin:28px auto 12px;width:94px;height:94px;border:0;border-radius:50%;cursor:pointer;font-size:2rem;color:#f6d79b;background:radial-gradient(circle at 35% 30%,#c32a32,var(--red) 62%,#360004);box-shadow:0 8px 20px #000a,inset 0 0 0 5px #8a1118,inset 0 0 0 7px #e0545a44,0 0 34px #740001cc;transition:transform .25s;-webkit-tap-highlight-color:transparent}
.seal:hover{transform:scale(1.07) rotate(-5deg)}
.seal:focus-visible,nav a:focus-visible,.pager button:focus-visible,.reaction button:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
.cap{margin:0;font:500 .9rem var(--cap);letter-spacing:.05em;opacity:.75}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:30px 0 6px}
nav a{display:block;padding:14px 8px;color:var(--parch);text-decoration:none;border:1px solid #d3a62566;border-radius:6px;background:#0b0a14aa;transition:background .25s,border-color .25s}
nav a:hover,nav a.on{border-color:var(--gold2);background:#74000166}
nav b{display:block;font-size:1.5rem}
nav span{font:700 .9rem var(--cap);color:var(--gold2);letter-spacing:.03em}
nav small{display:block;margin-top:3px;font-size:.82rem;opacity:.7}
.head{margin:30px 0 0;font:700 1.2rem var(--disp);color:var(--gold2)}
.head small{display:block;margin-top:6px;font:500 .9rem var(--cap);letter-spacing:.05em;opacity:.7}
.sheet{position:relative;margin:18px 0;padding:34px clamp(20px,6vw,44px);text-align:left;color:var(--ink);border-radius:3px;background:radial-gradient(ellipse at 50% 0,#fff7df,transparent 70%),linear-gradient(var(--parch),var(--parch2));box-shadow:0 22px 60px #000b,inset 0 0 60px #a8814144;animation:in .7s both}
.sheet::before{content:"";position:absolute;inset:8px;border:1px solid #8c6a2f55;pointer-events:none}
@keyframes in{from{opacity:0}}
.date{font:500 .9rem var(--cap);letter-spacing:.04em;color:#7a5a22}
.sheet h2{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 12px;margin:.35em 0 .5em;font:700 1.45rem/1.25 var(--cap);color:var(--red);overflow-wrap:anywhere}
.sheet h2>span:first-child{min-width:0;overflow-wrap:anywhere}
.meta{margin:-.2em 0 .8em;font-style:italic;color:#6b4e16}
.meta a{color:var(--red)}
.body{font-size:1.2rem;line-height:1.75;overflow-wrap:anywhere;word-break:normal}
.letter .body{color:var(--green)}
.body p,.body div,.body blockquote,.body h3{margin:.7em 0;unicode-bidi:plaintext}
.body h3{font:700 1.2rem var(--cap);color:var(--red)}
.body blockquote{padding-left:14px;border-left:3px solid var(--gold);font-style:italic}
.body img{display:block;max-width:100%;height:auto;margin:1em auto;border:6px solid #c59a3a;outline:1px solid #6b4e16;box-shadow:0 8px 18px #0005;transform:rotate(-.8deg)}
.body audio,.body video{display:block;width:min(100%,520px);max-width:100%;margin:1.2em auto}
.body video{max-height:480px;background:#090a13;border:1px solid #8c6a2f55;border-radius:3px}
.reaction{margin-top:24px;padding-top:18px;border-top:1px solid #80684444;text-align:center}
.reaction-label{margin:0 0 12px;color:#6b4e16;font:500 .82rem var(--cap);letter-spacing:.04em}
.reaction-trigger{min-height:42px;padding:9px 16px;border:1px solid #9b782f;border-radius:3px;color:#f7e7c6;background:linear-gradient(120deg,#284f3a,#356347);font:600 .78rem var(--cap);letter-spacing:.05em;cursor:pointer;transition:transform .2s,box-shadow .2s}
.reaction-trigger:hover{transform:translateY(-2px);box-shadow:0 6px 18px #35583c44}
.reaction-options{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.reaction-option{width:46px;height:44px;padding:4px;border:1px solid #9b782f66;border-radius:50%;color:inherit;background:#fff5;cursor:pointer;font-size:1.4rem;transition:transform .18s,background .18s,border-color .18s}
.reaction-option:hover,.reaction-option[aria-pressed="true"]{transform:scale(1.12);border-color:#9b782f;background:#d3a62533}
.reaction-option:disabled{cursor:default;opacity:.72}
.reaction-status{min-height:1.4em;margin:10px 0 0;color:#526b3e;font:italic .95rem var(--body)}
.hadith .body{font-family:Amiri,var(--body);font-size:1.35rem}
.stars{color:#b8861b;font-size:1.1rem;letter-spacing:.1em;white-space:nowrap}
.map-wrap{position:relative;margin:18px 0 24px;padding:7px;border:1px solid #d3a62577;background:#11121b;box-shadow:0 20px 48px #0009}
#placeMap{width:100%;height:min(65vh,560px);min-height:310px;background:#d9d3c3;border:1px solid #9a8557}
.map-caption{display:flex;justify-content:space-between;gap:12px;margin:9px 4px 2px;color:var(--parch);font:500 .76rem var(--cap);opacity:.78}
.map-foot{display:block;width:22px;height:25px;color:#5a3515;font:20px/25px system-ui,sans-serif;text-align:center;filter:drop-shadow(0 2px 2px #fff)}
.map-pin{display:grid;place-items:center;width:30px;height:30px;border:2px solid #f3d895;border-radius:50% 50% 50% 8%;color:#f7e8bd;background:linear-gradient(145deg,#9b102a,#4b0716);box-shadow:0 3px 10px #000a,0 0 14px #ba372d88;transform:rotate(-45deg);font:700 12px var(--cap)}
.map-pin span{transform:rotate(45deg)}
.map-popup{min-width:170px;max-width:320px;color:#342718;font:15px/1.45 var(--body);overflow-wrap:anywhere}
.map-popup strong{display:block;color:#740001;font:700 16px/1.3 var(--cap)}
.map-popup p{margin:8px 0 0;white-space:normal}.map-popup small{color:#6b4e16}
.unmapped{margin:22px 0;padding:18px;border:1px dashed #d3a62588;border-radius:4px;background:#0b0a1488;text-align:left}
.unmapped h4{margin:0 0 10px;color:var(--gold2);font:500 .85rem var(--cap)}
.unmapped .sheet{margin:10px 0;padding:16px}
.special-countdown{margin:15px 0 0;color:#f3d895;font:500 clamp(.85rem,3.8vw,1rem)/1.55 var(--cap);letter-spacing:.025em;text-shadow:0 0 14px #eeba3044}
.audio-player{display:grid;grid-template-columns:auto auto auto minmax(100px,1fr) auto;align-items:center;gap:9px;width:min(100%,520px);margin:18px auto;padding:12px 14px;border:1px solid #9b782f77;border-radius:5px;background:linear-gradient(120deg,#171522,#10121a);box-shadow:0 8px 24px #0005}
.audio-player button{display:grid;place-items:center;min-width:42px;min-height:42px;padding:7px;border:1px solid #d3a62566;border-radius:50%;color:#f1d58f;background:#282036;font:600 .78rem system-ui,sans-serif;cursor:pointer;transition:background .18s,transform .18s}
.audio-player button:hover{transform:scale(1.06);background:#4a1e31}
.audio-player .audio-toggle{width:48px;height:48px;color:#fff3ce;background:linear-gradient(135deg,#740001,#382047);border-color:#eeba30;font-size:1rem}
.audio-player__seek{width:100%;min-width:75px;accent-color:#d3a625;cursor:pointer}
.audio-player__time{min-width:72px;color:#dfcfaa;font: .72rem/1.2 system-ui,sans-serif;text-align:right;font-variant-numeric:tabular-nums}
.audio-player__source{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap}
.song-source-note{margin:9px 0;color:#6b4e16;font:italic .9rem var(--body);text-align:center}
.audio-player button:focus-visible,.audio-player__seek:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.leaflet-container{font-family:var(--body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#f1e3c3}
.leaflet-control-attribution{font:11px/1.3 system-ui,sans-serif}
.mirror{counter-reset:r;margin:20px 0;padding:40px 18px 14px;border:10px double var(--gold);border-radius:999px 999px 14px 14px/160px 160px 14px 14px;background:radial-gradient(ellipse at 50% 0,#2e3a86,#0c1030 70%);box-shadow:0 0 40px #d3a62544,inset 0 0 40px #000}
.mirror .sheet{counter-increment:r;margin:0;padding:18px 8px;text-align:center;color:var(--parch);background:none;box-shadow:none;border-bottom:1px solid #d3a62533;animation:none}
.mirror .sheet::before{content:"Reason № " counter(r);position:static;display:block;margin-bottom:6px;border:0;font:500 .9rem var(--cap);letter-spacing:.05em;color:var(--gold2)}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;font:500 .9rem var(--cap)}
.pager button{padding:9px 14px;font:700 .85rem var(--cap);color:var(--gold2);background:none;border:1px solid #d3a62588;border-radius:4px;cursor:pointer}
.pager button:disabled{opacity:.3;cursor:default}
.hint{margin:34px 0;font-style:italic;opacity:.75}
.mail-loading{display:flex;align-items:center;justify-content:center;gap:11px;min-height:64px;margin:34px 0;color:var(--gold2);font:500 .9rem var(--cap);letter-spacing:.04em}
.mail-loading__track{position:relative;width:26px;height:36px;overflow:hidden}
.mail-loading__letter{position:absolute;top:-18px;left:5px;color:var(--parch);font-size:1.15rem;line-height:1;filter:drop-shadow(0 2px 7px #d3a62555);animation:mail-load-fall 1.2s linear infinite}
.mail-loading__letter:nth-child(2){left:0;animation-delay:-.4s;opacity:.8}
.mail-loading__letter:nth-child(3){left:9px;animation-delay:-.8s;opacity:.65}
@keyframes mail-load-fall{0%{opacity:0;transform:translate3d(2px,-2px,0) rotate(-18deg)}12%{opacity:1}84%{opacity:.9}100%{opacity:0;transform:translate3d(-3px,48px,0) rotate(24deg)}}
.foot{margin:34px 0 0;font-size:.9rem;opacity:.7}
.sp{position:fixed;z-index:9;pointer-events:none;animation:sp .9s ease-out forwards}
@keyframes sp{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(90deg)}}
.owl{position:fixed;z-index:9;left:-80px;top:30%;font-size:2.4rem;pointer-events:none;animation:fly 2.2s ease-in-out forwards}
@keyframes fly{to{left:105%;top:8%;transform:rotate(-12deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Personal letter intro */
#mailExperience{display:none;position:fixed;z-index:20;inset:0;place-items:center;overflow-x:hidden;overflow-y:auto;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));color:#30251b;background:radial-gradient(ellipse at 50% 42%,#1d1c2c28,transparent 65%),linear-gradient(180deg,#090a13a8,#08070dc9);opacity:0;transition:opacity .65s ease,transform .65s ease;}
html.mail-intro-enabled #mailExperience{display:grid;opacity:1}
html.mail-intro-enabled #siteMain{visibility:hidden;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .65s ease,transform .65s ease,visibility .65s}
html.mail-intro-enabled.mail-leaving #mailExperience{opacity:0;pointer-events:none;transform:scale(1.015)}
html.mail-intro-enabled.mail-leaving #siteMain{visibility:visible;opacity:1;pointer-events:auto;transform:none}
.mail-stage{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"visual" "hint";justify-items:center;align-content:center;gap:18px;width:min(720px,100%);min-height:min(100%,700px);margin:auto}
.mail-object,.letter-paper{grid-area:visual;align-self:center;justify-self:center}
.mail-object{position:relative;display:block;width:min(560px,100%);aspect-ratio:1.62;padding:0;overflow:visible;border:0;border-radius:4px;background:none;cursor:pointer;perspective:1400px;-webkit-tap-highlight-color:transparent;opacity:1;visibility:visible;transform:translateY(0) scale(1);transition:opacity .55s ease,transform .65s cubic-bezier(.2,.75,.25,1),visibility .55s;}
.mail-object:focus-visible,.mail-continue:focus-visible{outline:3px solid #eccb8b;outline-offset:6px}
.mail-object__inner{position:absolute;inset:0;display:block;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.72,.18,1)}
.mail-face{position:absolute;inset:0;display:block;overflow:hidden;border:1px solid #bda779;border-radius:4px;background-color:#eddfc3;background-image:radial-gradient(ellipse at 18% 17%,#fff9e3a3,transparent 38%),radial-gradient(ellipse at 88% 82%,#aa895336,transparent 38%),linear-gradient(137deg,#f6e9cd,#e5d2ad 54%,#f1e2c5);box-shadow:0 22px 60px #000a,inset 0 0 46px #a47a3d29;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.mail-face::after{position:absolute;inset:8px;border:1px solid #8b6e4230;content:"";pointer-events:none}
.mail-face--address{display:grid;place-items:center;color:#245b43;transform:rotateY(0deg)}
.mail-face--address::before{position:absolute;inset:0;content:"";opacity:.22;background:repeating-linear-gradient(8deg,transparent 0 23px,#9c7a4333 24px,#fff8e766 25px,transparent 27px)}
.mail-recipient{position:relative;z-index:1;max-width:80%;color:#285940;font:500 clamp(1.25rem,4.7vw,2.2rem)/1.3 var(--body);letter-spacing:.035em;text-align:center;text-shadow:0 1px #fff9,0 0 1px #244a35;}
.mail-recipient strong{display:block;font:inherit;text-transform:uppercase}
.mail-recipient small{display:block;margin-top:8px;font:400 clamp(.87rem,2.8vw,1.08rem)/1.45 var(--body);letter-spacing:.015em;text-transform:capitalize;white-space:pre-line}
.mail-face--front{transform:rotateY(180deg)}
.mail-fold{position:absolute;inset:0;pointer-events:none}
.mail-fold--left{z-index:1;background:linear-gradient(125deg,#ead8b6,#f6e9cf);clip-path:polygon(0 0,51% 52%,0 100%)}
.mail-fold--right{z-index:1;background:linear-gradient(235deg,#d9c39d,#f5e6c9);clip-path:polygon(100% 0,49% 52%,100% 100%)}
.mail-fold--bottom{z-index:2;background:linear-gradient(0deg,#ddc8a2,#f5e7cc 75%);clip-path:polygon(0 100%,50% 46%,100% 100%)}
.mail-fold--top{z-index:3;background:linear-gradient(180deg,#f7ead0,#e3cfaa);clip-path:polygon(0 0,100% 0,50% 58%);filter:drop-shadow(0 3px 2px #71552b32)}
.mail-crest{position:absolute;z-index:4;top:5%;left:50%;display:block;width:clamp(92px,17vw,132px);height:clamp(116px,22vw,168px);transform:translateX(-50%);filter:drop-shadow(0 2px 2px #4e372c33)}
.mail-crest img,.letter-crest img{display:block;width:100%;height:100%;object-fit:contain}
.mail-wax{position:absolute;z-index:6;top:55%;left:50%;display:grid;place-items:center;width:clamp(68px,15vw,94px);aspect-ratio:1;border:2px solid #81202b;border-radius:48% 52% 46% 54%/52% 47% 53% 48%;color:#edb1a3;background:radial-gradient(circle at 32% 26%,#bf3a43,#78141f 61%,#4a0710);box-shadow:0 5px 12px #35251c73,inset 0 0 0 4px #9f2934,inset 0 0 0 6px #d7655944,0 0 0 1px #42050b;transform:translateX(-50%) rotate(-7deg);font:700 clamp(1.5rem,5vw,2.1rem) var(--body);text-shadow:0 1px 3px #3c0710}
.mail-wax::before{position:absolute;inset:9px;border:1px solid #e9897b66;border-radius:inherit;content:""}
.mail-postmark{position:absolute;z-index:4;top:54%;right:9%;display:grid;gap:5px;width:27%;transform:rotate(-7deg)}
.mail-postmark i{display:block;height:2px;border-radius:4px;background:#8b394080}
.mail-postmark i:nth-child(2){width:87%}.mail-postmark i:nth-child(3){width:95%}
.mail-hint{grid-area:hint;min-height:1.5em;margin:0;color:#f1e6d7;font:500 .82rem var(--cap);letter-spacing:.09em;text-align:center;text-shadow:0 2px 10px #000;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease,visibility .35s;}
.mail-skip{position:fixed;z-index:25;top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));min-height:44px;padding:10px 15px;border:1px solid #e7d4b066;border-radius:999px;color:#f3e6d1;background:#11111bcc;box-shadow:0 5px 18px #0007;font:500 .7rem var(--cap);letter-spacing:.09em;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.mail-skip:hover{transform:translateY(-1px);border-color:#edca8c;background:#30222b}
.mail-skip:focus-visible{outline:3px solid #eccb8b;outline-offset:4px}
#mailExperience[data-phase="swarm"] .mail-object,#mailExperience[data-phase="swarm"] .mail-hint{opacity:0;visibility:hidden;transform:translateY(16px) scale(.97)}
#mailExperience[data-phase="back"] .mail-object,#mailExperience[data-phase="back"] .mail-hint,#mailExperience[data-phase="front"] .mail-object,#mailExperience[data-phase="front"] .mail-hint{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
#mailExperience[data-phase="front"] .mail-object__inner{transform:rotateY(180deg)}
#mailExperience[data-phase="letter"] .mail-object{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(12px) scale(.91)}
#mailExperience[data-phase="letter"] .mail-hint{display:none}
.mail-storm{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:1;transition:opacity .5s ease,visibility .5s}
#mailExperience[data-phase="back"] .mail-storm,#mailExperience[data-phase="front"] .mail-storm,#mailExperience[data-phase="letter"] .mail-storm{opacity:0;visibility:hidden}
.flying-envelope{position:absolute;top:-20vh;left:var(--left);width:var(--width);aspect-ratio:1.58;border:1px solid #a88c5e;border-radius:2px;background:linear-gradient(150deg,#f8edda,#dfcaa5);box-shadow:0 12px 32px #0009;opacity:0;transform-style:preserve-3d;animation:letter-swoop var(--duration) var(--delay) cubic-bezier(.32,.05,.56,.98) forwards;will-change:transform,opacity}
.flying-envelope::before{position:absolute;inset:0;background:linear-gradient(150deg,#fff2d9,#e6d3ad);clip-path:polygon(0 0,100% 0,50% 62%);content:""}
.flying-envelope::after{position:absolute;z-index:1;top:39%;left:47%;width:13%;aspect-ratio:1;border:1px solid #7a1723;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c04145,#72101b 72%);box-shadow:0 2px 4px #47331e66;content:""}
.flying-address{position:absolute;z-index:1;right:4%;bottom:10%;left:5%;overflow:hidden;color:#285940;font:500 clamp(6px,1vw,10px)/1.1 var(--body);letter-spacing:.01em;text-overflow:ellipsis;white-space:nowrap;text-align:center}

<script>
(() => {
  const root = document.documentElement;
  const flow = document.getElementById('mailExperience');
  const envelope = document.getElementById('mailObject');
  const letter = document.getElementById('welcomeLetter');
  const hint = document.getElementById('mailHint');
  const continueButton = document.getElementById('enterGreeting');
  const skipButton = document.getElementById('skipIntro');
  const prefersLessMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const defaults = {
    recipient: 'MR. S. D. SETYAWAN',
    addressLines: ['The Cupboard Under the Stairs', '4 Privet Drive', 'Little Whinging', 'Surrey'],
    salutation: 'Dear Satrio,',
    paragraphs: ['We are pleased to inform you that you have been given a chance to explore this web page.'],
    closing: 'Yours sincerely,',
    signature: ''
  };
  const copy = { ...defaults, ...(window.CFG && window.CFG.letter ? window.CFG.letter : {}) };
  const recipient = String(copy.recipient || defaults.recipient);
  const addressLines = Array.isArray(copy.addressLines) ? copy.addressLines : [String(copy.addressLines || '')];
  const paragraphs = Array.isArray(copy.paragraphs) ? copy.paragraphs : [String(copy.paragraphs || '')];

  document.getElementById('postRecipient').textContent = recipient;
  document.getElementById('letterRecipient').textContent = recipient;
  document.getElementById('postAddress').textContent = addressLines.join('\n');
  document.getElementById('letterAddress').textContent = addressLines.join('\n');
  document.getElementById('letterSalutation').textContent = String(copy.salutation || '');
  document.getElementById('letterClosing').textContent = String(copy.closing || '');
  const signature = document.getElementById('letterSignature');
  if (copy.signature) {
    signature.textContent = String(copy.signature);
    signature.hidden = false;
  }
  const letterCopy = document.getElementById('letterCopy');
  paragraphs.filter(text => String(text).trim()).forEach(text => {
    const paragraph = document.createElement('p');
    paragraph.textContent = String(text);
    letterCopy.append(paragraph);
  });

  const storm = document.getElementById('mailStorm');
  const randomBetween = (min, max) => min + Math.random() * (max - min);
  const hasOpeningIntro = root.classList.contains('mail-intro-enabled');
  if (!prefersLessMotion.matches && hasOpeningIntro) {
      const letterCount = window.innerWidth < 600 ? 48 : 74;
      for (let i = 0; i < letterCount; i++) {
      const flyingLetter = document.createElement('span');
      const flyingAddress = document.createElement('span');
      const flyingStamp = document.createElement('span');
      flyingLetter.className = 'flying-envelope';
      flyingAddress.className = 'flying-address';
      flyingAddress.textContent = recipient;
      flyingStamp.className = 'flying-stamp';
      flyingStamp.textContent = 'H';
      flyingLetter.append(flyingAddress, flyingStamp);
      const letterWidth = Math.min(randomBetween(92, 174), window.innerWidth * .52);
      const maxLeft = Math.max(0, 100 - letterWidth / window.innerWidth * 100);
      flyingLetter.style.setProperty('--left', randomBetween(0, maxLeft).toFixed(1) + '%');
      flyingLetter.style.setProperty('--width', letterWidth.toFixed(0) + 'px');
      flyingLetter.style.setProperty('--sway-one', randomBetween(-9, 9).toFixed(0) + 'vw');
      flyingLetter.style.setProperty('--sway-two', randomBetween(-16, 16).toFixed(0) + 'vw');
      flyingLetter.style.setProperty('--sway-three', randomBetween(-12, 12).toFixed(0) + 'vw');
      flyingLetter.style.setProperty('--sway-four', randomBetween(-18, 18).toFixed(0) + 'vw');
      flyingLetter.style.setProperty('--from-rotate', randomBetween(-35, 35).toFixed(0) + 'deg');
      flyingLetter.style.setProperty('--mid-rotate', randomBetween(-190, 190).toFixed(0) + 'deg');
      flyingLetter.style.setProperty('--to-rotate', randomBetween(-360, 360).toFixed(0) + 'deg');
      flyingLetter.style.setProperty('--from-flip', randomBetween(-28, 28).toFixed(0) + 'deg');
      flyingLetter.style.setProperty('--mid-flip', randomBetween(80, 300).toFixed(0) + 'deg');
      flyingLetter.style.setProperty('--to-flip', randomBetween(250, 540).toFixed(0) + 'deg');
      flyingLetter.style.setProperty('--mid-scale', randomBetween(.9, 1.45).toFixed(2));
      flyingLetter.style.setProperty('--to-scale', randomBetween(.48, .95).toFixed(2));
      flyingLetter.style.setProperty('--duration', randomBetween(1600, 2500).toFixed(0) + 'ms');
      flyingLetter.style.setProperty('--delay', randomBetween(0, 450).toFixed(0) + 'ms');
      storm.append(flyingLetter);
    }
  }

  function setPhase(phase) {
    flow.dataset.phase = phase;
    if (phase === 'back') {
      window.setTimeout(() => storm.replaceChildren(), 650);
      envelope.setAttribute('aria-label', 'Turn the envelope over to see the seal');
      hint.textContent = 'Click the letter to turn it over.';
    } else if (phase === 'front') {
      envelope.setAttribute('aria-label', 'Open the sealed letter');
      hint.textContent = 'Click again to open your letter.';
    } else if (phase === 'letter') {
      hint.textContent = '';
    }
  }

  envelope.addEventListener('click', () => {
    if (flow.dataset.phase === 'back') {
      setPhase('front');
      return;
    }
    if (flow.dataset.phase === 'front') {
      letter.hidden = false;
      setPhase('letter');
      window.requestAnimationFrame(() => continueButton.focus({ preventScroll: true }));
    }
  });

  function leaveIntro() {
    if(root.classList.contains('mail-leaving'))return;
    storm.replaceChildren();
    root.classList.add('mail-leaving');
    window.setTimeout(() => {
      root.classList.remove('mail-intro-enabled', 'mail-leaving');
      document.getElementById('hi').focus({ preventScroll: true });
    }, prefersLessMotion.matches ? 0 : 680);
  }
  continueButton.addEventListener('click',leaveIntro);
  skipButton.addEventListener('click',leaveIntro);

  if (hasOpeningIntro) {
    if (prefersLessMotion.matches) {
      setPhase('back');
    } else {
      window.setTimeout(() => setPhase('back'), 3050);
    }
  }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $=s=>document.querySelector(s),C=window.CFG||{},T=(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})();
const LOCAL_HOST=location.protocol==='file:'||['localhost','127.0.0.1','::1'].includes(location.hostname);
const DEMO_MODE=LOCAL_HOST&&new URLSearchParams(location.search).get('demo')==='1';
const DEMO_ENTRIES='owlpost:local-admin-demo-entries:v1',DEMO_SETTINGS='owlpost:local-admin-demo-settings:v1';
const sb=!DEMO_MODE&&C.url&&window.supabase?supabase.createClient(C.url,C.key):null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=h=>window.DOMPurify?DOMPurify.sanitize(h||'',{ADD_TAGS:['audio','video','source'],ADD_ATTR:['controls','preload','playsinline','poster']}):'';
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

// the five sections (d = "of the day": shows today's entry, with older ones behind a pager)
const S={
  letter:{i:'✉️',n:'Owl Post',s:'Letter of the day',d:1},
  song:{i:'🎶',n:'Wizarding Wireless',s:'Song of the day',d:1},
  hadith:{i:'📜',n:'The Library',s:'Hadith of the day',d:1},
  reason:{i:'🪞',n:'Mirror of Erised',s:'Reasons why I love you'},
  place:{i:'🗺️',n:"Marauder's Map",s:"Places we've been"}
};

// sample data, only used until config.js is filled in
const DEMO=[
  {kind:'letter',day:T,title:'Dear you,',body:'<p>This is a sample letter. Once Supabase is connected, your real stories appear here, with photos wherever you put them.</p>'},
  {kind:'song',day:T,title:'Sample song',meta:{artist:'Some artist',link:''},body:'<p>Why this song reminds me of you.</p>'},
  {kind:'hadith',day:T,title:'',meta:{source:'Source and number'},body:'<p>Arabic text and translation go here.</p>'},
  {kind:'reason',day:T,body:'<p>The way you laugh at your own jokes first.</p>'},
  {kind:'reason',day:T,body:'<p>You always remember the small things.</p>'},
  {kind:'place',day:T,title:'Our favourite café',meta:{rating:5},body:'<p>Best hot chocolate, best company.</p>'}
];

let placeMap=null,specialEvents=[];

async function load(k){
  if(DEMO_MODE){try{const items=JSON.parse(localStorage.getItem(DEMO_ENTRIES)||'[]');const saved=Array.isArray(items)?items.filter(e=>e.kind===k):[];if(saved.length)return saved}catch{}}
  if(!sb)return DEMO.filter(e=>e.kind===k);
  const{data,error}=await sb.from('entries').select('*').eq('kind',k).order('day',{ascending:false}).order('created_at',{ascending:false});
  return error?[]:data;
}

const stars=n=>{n=Math.max(0,Math.min(5,+n||0));return'★'.repeat(n)+'☆'.repeat(5-n)};
function card(k,e){
  const m=e.meta||{},bodyHasAudio=/\baudio\b/i.test(e.body||''),b=`<div class="body">${clean(e.body)}</div>`;
  if(k==='reason')return`<article class="sheet reason">${b}</article>`;
  let h='';
  if(e.title||k==='place')h=`<h2><span>${esc(e.title)}</span>${k==='place'?`<span class="stars">${stars(m.rating)}</span>`:''}</h2>`;
  if(k==='song'&&m.artist)h+=`<p class="meta">${esc(m.artist)}</p>`;
  if(k==='hadith'&&m.source)h+=`<p class="meta">${esc(m.source)}</p>`;
  const react=k==='letter'?reactionMarkup(e):'';
  const songNote=k==='song'&&!bodyHasAudio?'<p class="song-source-note">The song MP3 is on its way. Add it from Staff Room to play it here.</p>':'';
  return`<article class="sheet ${k}"><div class="date">${fmt(e.day)}</div>${h}${k==='song'?songNote:''}${b}${react}</article>`;
}

function mountAudioPlayer(audio){
  const group=document.createElement('div');group.className='audio-player';group.setAttribute('role','group');group.setAttribute('aria-label',audio.getAttribute('aria-label')||'Song player');
  const makeButton=(label,text,className,title)=>{const button=document.createElement('button');button.type='button';button.className=className;button.setAttribute('aria-label',label);button.title=title;button.textContent=text;return button};
  const back=makeButton('Back 10 seconds','−10','audio-back','Back 10 seconds'),play=makeButton('Play song','▶','audio-toggle','Play'),forward=makeButton('Forward 10 seconds','+10','audio-forward','Forward 10 seconds');
  const seek=document.createElement('input');seek.className='audio-player__seek';seek.type='range';seek.min='0';seek.max='1000';seek.value='0';seek.step='1';seek.setAttribute('aria-label','Seek through song');
  const clock=document.createElement('span');clock.className='audio-player__time';clock.textContent='0:00 / --:--';
  const source=audio.parentNode;audio.removeAttribute('controls');audio.classList.add('audio-player__source');audio.setAttribute('aria-hidden','true');audio.tabIndex=-1;audio.preload='metadata';
  source.replaceChild(group,audio);group.append(back,play,forward,seek,clock,audio);
  const time=value=>{if(!Number.isFinite(value))return'--:--';const n=Math.max(0,Math.floor(value));return`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`};
  const update=()=>{const duration=Number.isFinite(audio.duration)?audio.duration:0,ratio=duration?audio.currentTime/duration:0;if(document.activeElement!==seek)seek.value=String(Math.round(ratio*1000));seek.disabled=!duration;clock.textContent=`${time(audio.currentTime)} / ${time(duration)}`;play.textContent=audio.paused?'▶':'Ⅱ';play.setAttribute('aria-label',audio.paused?'Play song':'Pause song');play.title=audio.paused?'Play':'Pause'};
  play.addEventListener('click',()=>audio.paused?audio.play().catch(()=>{}):audio.pause());
  back.addEventListener('click',()=>{audio.currentTime=Math.max(0,audio.currentTime-10)});
  forward.addEventListener('click',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(audio.duration,audio.currentTime+10)});
  seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)){audio.currentTime=audio.duration*(+seek.value/1000);update()}});
  ['loadedmetadata','durationchange','timeupdate','play','pause','ended','seeked'].forEach(name=>audio.addEventListener(name,update));
  audio.addEventListener('error',()=>{clock.textContent='Audio unavailable';seek.disabled=true});update();return{audio,play};
}
function setupAudioPlayers(){return Array.from($('#view .song .body audio')).map(mountAudioPlayer)}

const REACTIONS=['❤️','🥹','🥰','🌷','😂'];
const VISITOR_STORE='owlpost:visitor-id:v1';
function reactionMarkup(entry){
  const options=REACTIONS.map((emoji,i)=>`<button class="reaction-option" type="button" data-reaction="${emoji}" aria-label="React ${['love','with teary eyes','with a hug','with a flower','with a laugh'][i]}" aria-pressed="false">${emoji}</button>`).join('');
  return`<section class="reaction" data-entry-id="${esc(entry.id||'')}" aria-label="Letter reactions"><p class="reaction-label">Did this letter make you smile?</p><button class="reaction-trigger" type="button" aria-expanded="false">💌 Leave a reaction</button><div class="reaction-options" hidden>${options}</div><p class="reaction-status" role="status" aria-live="polite">When you send one, the letter and time are saved. Location is optional.</p></section>`;
}

function visitorId(){
  let id='';
  try{id=localStorage.getItem(VISITOR_STORE)||''}catch{}
  if(!id){id=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;try{localStorage.setItem(VISITOR_STORE,id)}catch{}}
  return id;
}

function getReactionLocation(){
  if(!navigator.geolocation)return Promise.resolve(null);
  return new Promise(resolve=>{
    try{navigator.geolocation.getCurrentPosition(
      p=>resolve({latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy}),
      ()=>resolve(null),{enableHighAccuracy:false,maximumAge:60000,timeout:4500}
    )}catch{resolve(null)}
  });
}

$('#view').addEventListener('click',async e=>{
  const trigger=e.target.closest('.reaction-trigger');
  if(trigger){
    const box=trigger.closest('.reaction');
    const options=box.querySelector('.reaction-options');
    options.hidden=!options.hidden;
    trigger.setAttribute('aria-expanded',String(!options.hidden));
    return;
  }
  const button=e.target.closest('.reaction-option');
  if(!button)return;
  const box=button.closest('.reaction'),emoji=button.dataset.reaction,status=box.querySelector('.reaction-status');
  if(box.dataset.busy==='true')return;
  box.dataset.busy='true';
  box.querySelectorAll('.reaction-option').forEach(option=>option.disabled=true);
  status.textContent='Sending your reaction…';
  let alreadyRecorded=false;
  if(sb&&box.dataset.entryId){
    try{
      const loc=await getReactionLocation();
      const{error}=await sb.from('letter_reactions').insert({entry_id:box.dataset.entryId,visitor_id:visitorId(),reaction:emoji,context:`${location.pathname}${location.hash||'#letter'}`,latitude:loc?.latitude??null,longitude:loc?.longitude??null,accuracy:loc?.accuracy??null});
      if(error?.code==='23505')alreadyRecorded=true;
      else if(error)throw error;
    }catch(error){
      delete box.dataset.busy;box.querySelectorAll('.reaction-option').forEach(option=>option.disabled=false);
      console.error('Could not save the letter reaction:',error);
      status.textContent=error?.message?`Could not save reaction: ${error.message}`:'Could not save reaction. Please try again.';return;
    }
  }
  delete box.dataset.busy;
  box.querySelectorAll('.reaction-option').forEach(option=>{option.disabled=false;option.setAttribute('aria-pressed',String(!alreadyRecorded&&option===button))});
  box.querySelector('.reaction-options').hidden=false;
  const triggerButton=box.querySelector('.reaction-trigger');triggerButton.textContent=alreadyRecorded?'Reaction already saved ✨':'Reaction sent ✨';triggerButton.setAttribute('aria-expanded','true');
  status.textContent=alreadyRecorded?'A reaction from this browser was already saved for this letter ✨':sb&&box.dataset.entryId?'Your reaction was delivered ✨':'Your reaction is saved on this device ✨';
});

function placePopup(entry){
  const doc=new DOMParser().parseFromString(entry.body||'','text/html');
  const blockTags=new Set(['P','DIV','BLOCKQUOTE','H1','H2','H3','H4','H5','H6','LI']);
  const extract=node=>{
    if(node.nodeType===Node.TEXT_NODE)return node.nodeValue||'';
    if(node.nodeType!==Node.ELEMENT_NODE)return'';
    if(node.tagName==='BR')return'\n';
    const content=Array.from(node.childNodes).map(extract).join('');
    return blockTags.has(node.tagName)?`\n${content}\n`:content;
  };
  const cleanText=extract(doc.body).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  const m=entry.meta||{},starsText=stars(m.rating);
  return`<div class="map-popup"><strong>${esc(entry.title||'A place we visited')}</strong><small>${esc(fmt(entry.day||T))} · ${esc(starsText)}</small>${cleanText?`<p>${esc(cleanText).replace(/\n/g,'<br>')}</p>`:''}</div>`;
}
function showPlaces(list){
  const located=list.filter(e=>Number.isFinite(+e.meta?.lat)&&Number.isFinite(+e.meta?.lng));
  const missing=list.filter(e=>!Number.isFinite(+e.meta?.lat)||!Number.isFinite(+e.meta?.lng));
  const head=`<h3 class="head">${S.place.i} ${S.place.n}<small>${S.place.s}</small></h3>`;
  const fallback=missing.length?`<section class="unmapped"><h4>Places waiting for a map pin</h4>${missing.map(e=>card('place',e)).join('')}</section>`:'';
  if(!located.length){$('#view').innerHTML=head+'<p class="hint">No pinned places yet. Add a place and tap its location on the map in the Staff Room.</p>'+fallback;return}
  $('#view').innerHTML=head+'<div class="map-wrap"><div id="placeMap" role="application" aria-label="Map of places visited"></div><div class="map-caption"><span>👣 Follow the visits in date order</span><span>Map data © OpenStreetMap contributors</span></div></div>'+fallback;
  if(!window.L){$('#placeMap').insertAdjacentHTML('afterend','<p class="hint">The map could not load. Please check your connection.</p>');return}
  const map=L.map('placeMap',{scrollWheelZoom:false}).setView([-6.2,106.816666],11);placeMap=map;
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'}).addTo(map);
  const ordered=[...located].sort((a,b)=>String(a.day).localeCompare(String(b.day))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
  const points=[];
  ordered.forEach((entry,index)=>{
    const point=[+entry.meta.lat,+entry.meta.lng];points.push(point);
    const marker=L.marker(point,{title:entry.title||`Visit ${index+1}`,icon:L.divIcon({className:'',html:`<span class="map-pin"><span>${index+1}</span></span>`,iconSize:[30,30],iconAnchor:[15,26]})}).addTo(map);
    marker.bindPopup(placePopup(entry),{maxWidth:360,maxHeight:Math.min(window.innerHeight*.6,420),autoPanPadding:[18,18]});
    marker.bindTooltip(`${index+1}. ${esc(entry.title||'Visit')}`,{direction:'top',offset:[0,-12]});
  });
  for(let i=1;i<points.length;i++){
    const a=L.latLng(points[i-1]),b=L.latLng(points[i]);
    L.polyline([a,b],{color:'#72561c',weight:3,dashArray:'2 11',opacity:.9,lineCap:'round'}).addTo(map);
    const steps=Math.max(1,Math.min(7,Math.round(a.distanceTo(b)/2200)));
    for(let step=1;step<=steps;step++){
      const ratio=step/(steps+1),at=L.latLng(a.lat+(b.lat-a.lat)*ratio,a.lng+(b.lng-a.lng)*ratio);
      L.marker(at,{interactive:false,icon:L.divIcon({className:'',html:'<span class="map-foot" aria-hidden="true">👣</span>',iconSize:[22,25],iconAnchor:[11,12]})}).addTo(map);
    }
  }
  if(points.length>1)map.fitBounds(L.latLngBounds(points).pad(.16));else map.setView(points[0],14);
  requestAnimationFrame(()=>map.invalidateSize());
}

async function loadSpecialEvents(){
  if(DEMO_MODE){try{const saved=JSON.parse(localStorage.getItem(DEMO_SETTINGS)||'{"events":[]}');specialEvents=Array.isArray(saved.events)?saved.events:[]}catch{specialEvents=[]}updateSpecialGreeting();return}
  if(!sb)return;
  const{data,error}=await sb.from('site_settings').select('value').eq('id','special-days').maybeSingle();
  if(!error&&Array.isArray(data?.value?.events))specialEvents=data.value.events;
  updateSpecialGreeting();
}
function dayDistance(from,to){return Math.round((Date.UTC(to.getFullYear(),to.getMonth(),to.getDate())-Date.UTC(from.getFullYear(),from.getMonth(),from.getDate()))/86400000)}
function upcomingEvents(events){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return events.map(event=>{
    if(!event?.date)return null;
    const parts=String(event.date).split('-').map(Number);if(parts.length!==3||parts.some(n=>!n))return null;
    let next=new Date(parts[0],parts[1]-1,parts[2]);
    if(event.repeat){next=new Date(today.getFullYear(),parts[1]-1,parts[2]);if(next<today)next.setFullYear(today.getFullYear()+1)}
    const days=dayDistance(today,next);return days<0?null:{...event,days};
  }).filter(Boolean).sort((a,b)=>a.days-b.days);
}
function updateSpecialGreeting(){
  const events=upcomingEvents(specialEvents),today=events.find(event=>event.days===0),next=events[0];
  $('#hi').textContent=today?.greeting?.trim()||(today?.name?`Happy ${today.name}!`:'Happy '+new Date().toLocaleDateString('en-US',{weekday:'long'})+'!');
  const countdown=$('#specialCountdown');
  if(next){countdown.hidden=false;countdown.textContent=next.days===0?`🚂 Hogwarts Express berangkat hari ini · ${next.name||'hari spesial'}`:`🚂 Hogwarts Express berangkat dalam ${next.days} hari · menuju ${next.name||'hari spesial'}`}
  else countdown.hidden=true;
}

async function route(){
  scrollTo(0,0);
  if(placeMap){placeMap.remove();placeMap=null}
  const pathPage=location.pathname.replace(/\/+$/,'').split('/').pop();
  const k=location.hash.slice(1)||(S[pathPage]?pathPage:'');
  const s=S[k],v=$('#view');
  $('#home').hidden=!!s;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  v.innerHTML='';
  if(!s)return;
  v.innerHTML=k==='letter'||k==='song'
    ?'<div class="mail-loading" role="status"><span class="mail-loading__track" aria-hidden="true"><span class="mail-loading__letter">✉</span><span class="mail-loading__letter">✉</span><span class="mail-loading__letter">✉</span></span><span>🦉 the owl is fetching it…</span></div>'
    :'<p class="hint">🦉 the owl is fetching it…</p>';
  let list=await load(k);
  if(s.d)list=list.filter(e=>e.day<=T);   // future-dated entries stay hidden until their day
  if(k==='reason')list.reverse();           // oldest first, so reason numbers never change
  if(k==='place'){showPlaces(list);return}
  const head=`<h3 class="head">${s.i} ${s.n}<small>${s.s}</small></h3>`;
  if(!list.length){v.innerHTML=head+'<p class="hint">Nothing here yet. The owl is still on its way 🦉</p>';return}
  if(!s.d){
    const cards=list.map(e=>card(k,e)).join('');
    v.innerHTML=head+(k==='reason'?`<div class="mirror">${cards}</div>`:cards);
    return;
  }
  let i=0;
  const draw=()=>{
    v.innerHTML=head+card(k,list[i])+`<div class="pager"><button id="pv" type="button" ${i>=list.length-1?'disabled':''}>‹ older</button><span>${i+1} / ${list.length}</span><button id="nx" type="button" ${i?'':'disabled'}>newer ›</button></div>`;
    $('#pv').onclick=()=>{i++;draw()};
    $('#nx').onclick=()=>{i--;draw()};
  };
  draw();
  if(k==='song'){
    const players=setupAudioPlayers();
    players.forEach(({audio})=>{audio.autoplay=true;audio.play().catch(()=>{})});
  }
}

function burst(x,y){
  if(calm)return;
  for(let i=0;i<14;i++){
    const p=document.createElement('span'),a=Math.random()*6.28,d=50+Math.random()*90;
    p.className='sp';p.textContent=['✨','⚡','💛','🕯️','✦'][i%5];
    p.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px`;
    p.onanimationend=()=>p.remove();document.body.append(p);
  }
}

$('#seal').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2);
  if(!calm){const o=document.createElement('div');o.className='owl';o.textContent='🦉';document.body.append(o);setTimeout(()=>o.remove(),2300)}
  setTimeout(()=>{location.hash='letter'},calm?0:650);
};

// greeting + header
$('#hi').textContent='Happy '+new Date().toLocaleDateString('en-US',{weekday:'long'})+'!';
$('#sub').innerHTML=fmt(T)+'<br>'+(C.name?'for '+esc(C.name):'to one of my favorite person')+' 💖';
loadSpecialEvents();
if(C.name)document.title='to: '+C.name+' 🦉';
if(!sb)$('.foot').append(' (sample data: fill in config.js)');
$('#nav').innerHTML=Object.entries(S).map(([k,s])=>`<a href="#${k}" data-k="${k}"><b>${s.i}</b><span>${s.n}</span><small>${s.s}</small></a>`).join('');

// atmosphere: twinkling stars + floating candles
for(let i=0;i<60;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--l:-${Math.random()*5}s`;$('#sky').append(s)}
for(let i=0;i<8;i++){const c=document.createElement('i');c.className='candle';c.style.cssText=`--x:${5+i*12+Math.random()*5}%;--y:${3+Math.random()*20}%;--d:${3+Math.random()*3}s`;$('#candles').append(c)}

addEventListener('hashchange',route);
route();
</script>
